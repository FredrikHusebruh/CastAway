# CastAway CI/CD - no server needed.
#
# On every push / pull request: test the backend and build the frontend.
# On push to Main, every morning, or the "Run workflow" button: run the forecast on GitHub's computers,
# build the static website with the forecast files inside, and upload it by FTP to Hostinger
# (public_html/castaway/, i.e. https://<your domain>/castaway/). Only changed files are uploaded.
#
# Settings (GitHub repo -> Settings -> Secrets and variables -> Actions):
#   Secrets   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD   Hostinger FTP account (hPanel -> Files -> FTP Accounts)
#             BW_CLIENT_ID, BW_CLIENT_SECRET            BarentsWatch API client (optional: without them the public download is used)
#   Variables CASTAWAY_REGION                  region preset (default finnmark_east; e.g. kristiansand)
#             CASTAWAY_MOCK                    "true" = publish randomly generated demo reports (shows a MOCK DATA badge)
#             CASTAWAY_HINDCAST_DAYS           days of drift before today (default 7; 30 takes much longer the first time)

name: CI/CD

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * *" # every day at 04:17 UTC (06:17 Norwegian summer time)
  workflow_dispatch: {}

permissions:
  contents: read # the site is uploaded by FTP; the workflow never writes to the repository

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest -q

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_STATIC: "true"

  publish:
    name: Forecast and publish
    needs: [backend, frontend]
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/Main')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    concurrency:
      group: publish
      cancel-in-progress: false
    env:
      CASTAWAY_REGION: ${{ vars.CASTAWAY_REGION || 'finnmark_east' }}
      CASTAWAY_HINDCAST_DAYS: ${{ vars.CASTAWAY_HINDCAST_DAYS || '7' }}
      BW_CLIENT_ID: ${{ secrets.BW_CLIENT_ID }}
      BW_CLIENT_SECRET: ${{ secrets.BW_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      # NorKyst ocean data is downloaded once per day and reused by later runs (MET asks for cached, sequential access).
      # Only the public ocean data is cached: caches can be read by pull-request runs (also from forks), so the
      # BarentsWatch downloads in backend/data/raw must never be part of it.
      - name: Restore cached ocean data
        uses: actions/cache@v4
        with:
          path: backend/data/raw/forcing
          key: forcing-${{ env.CASTAWAY_REGION }}-${{ github.run_id }}
          restore-keys: forcing-${{ env.CASTAWAY_REGION }}-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run forecast (BarentsWatch + MET NorKyst -> OpenDrift -> beaching files)
        working-directory: backend
        run: |
          if [ "${{ vars.CASTAWAY_MOCK }}" = "true" ]; then
            python scripts/make_mock_gear.py --n 60
            python scripts/run_forecast.py --mock
          else
            python scripts/run_forecast.py
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build static site with the forecast files
        working-directory: frontend
        env:
          VITE_STATIC: "true"
        run: |
          npm ci
          npm run build
          mkdir -p dist/data
          # files the map reads; runs/ (raw simulation output) and tracks/ (API-only) are not published
          rsync -a --exclude 'runs/' --exclude 'tracks/' --exclude '*.png' ../backend/data/output/ dist/data/
          du -sh dist dist/data

      # Syncs dist/ to the server: uploads new/changed files and deletes files that are no longer in the build
      # (it keeps a .ftp-deploy-sync-state.json on the server to know what is there).
      - name: Upload to Hostinger (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: frontend/dist/
          server-dir: public_html/castaway/
