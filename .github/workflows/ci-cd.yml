# CastAway CI/CD - no server needed.
#
# On every push / pull request: test the backend, and lint + build the app (mobile/) and the debug map (frontend/).
# On push to Main, every morning, or the "Run workflow" button: run the forecast on GitHub's computers, put the
# website together and upload it by FTP to Hostinger (public_html/castaway/, i.e. https://<your domain>/castaway/):
#   castaway/        the app (mobile/), used on phones and PCs
#   castaway/data/   the forecast files
#   castaway/debug/  the debug map (frontend/), reading ../data; left out (with a warning) if it fails to build
# Only changed files are uploaded.
#
# Settings (GitHub repo -> Settings -> Secrets and variables -> Actions):
#   Secrets   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD   Hostinger FTP account (hPanel -> Files -> FTP Accounts)
#             BW_CLIENT_ID, BW_CLIENT_SECRET            BarentsWatch API client (optional: without them the public download is used)
#   Variables CASTAWAY_REGION                  region preset (default finnmark_east; e.g. kristiansand)
#             CASTAWAY_MOCK                    "true" = publish randomly generated demo reports (shows a MOCK DATA badge)
#             CASTAWAY_HINDCAST_DAYS           days of drift before today (default 7; 30 takes much longer the first time)

name: CI/CD

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * *" # every day at 04:17 UTC (06:17 Norwegian summer time)
  workflow_dispatch: {}

permissions:
  contents: read # the site is uploaded by FTP; the workflow never writes to the repository

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest -q

  # The app. Its static build doesn't depend on the forecast data, so the publish job reuses this build.
  mobile:
    name: App (mobile/) lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_STATIC: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: app-dist
          path: mobile/dist
          include-hidden-files: true # .htaccess
          retention-days: 3

  # The debug map, built to read the app's data folder from castaway/debug/.
  frontend:
    name: Debug map (frontend/) lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_STATIC: "true"
          VITE_DATA_URL: ../data
      - uses: actions/upload-artifact@v4
        with:
          name: debug-dist
          path: frontend/dist
          include-hidden-files: true
          retention-days: 3

  publish:
    name: Forecast and publish
    # Waits for the debug map too, but only the backend tests and the app have to pass:
    # a broken debug tool must never stop the real app's daily forecast.
    needs: [backend, mobile, frontend]
    if: >-
      always() && needs.backend.result == 'success' && needs.mobile.result == 'success' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/Main'))
    runs-on: ubuntu-latest
    timeout-minutes: 150
    concurrency:
      group: publish
      cancel-in-progress: false
    env:
      CASTAWAY_REGION: ${{ vars.CASTAWAY_REGION || 'finnmark_east' }}
      CASTAWAY_HINDCAST_DAYS: ${{ vars.CASTAWAY_HINDCAST_DAYS || '7' }}
      BW_CLIENT_ID: ${{ secrets.BW_CLIENT_ID }}
      BW_CLIENT_SECRET: ${{ secrets.BW_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      # NorKyst ocean data is downloaded once per day and reused by later runs (MET asks for cached, sequential access).
      # Only the public ocean data is cached: caches can be read by pull-request runs (also from forks), so the
      # BarentsWatch downloads in backend/data/raw must never be part of it.
      - name: Restore cached ocean data
        uses: actions/cache@v4
        with:
          path: backend/data/raw/forcing
          key: forcing-${{ env.CASTAWAY_REGION }}-${{ github.run_id }}
          restore-keys: forcing-${{ env.CASTAWAY_REGION }}-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run forecast (BarentsWatch + MET NorKyst -> OpenDrift -> beaching files)
        working-directory: backend
        run: |
          if [ "${{ vars.CASTAWAY_MOCK }}" = "true" ]; then
            python scripts/make_mock_gear.py --n 60
            python scripts/run_forecast.py --mock
          else
            python scripts/run_forecast.py
          fi

      # Put the website together in site/ from the builds above plus the forecast files.
      - name: Get the app build
        uses: actions/download-artifact@v4
        with:
          name: app-dist
          path: site
      - name: Get the debug map build
        if: needs.frontend.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: debug-dist
          path: site/debug
      - name: Add the forecast files
        run: |
          if [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "::warning::The debug map (frontend/) failed to build, so castaway/debug/ is left out of this deploy."
          fi
          mkdir -p site/data
          # files the app reads; runs/ (raw simulation output) and tracks/ (API-only) are not published
          rsync -a --exclude 'runs/' --exclude 'tracks/' --exclude '*.png' backend/data/output/ site/data/
          du -sh site site/data

      # Syncs site/ to the server: uploads new/changed files and deletes files that are no longer in the build
      # (it keeps a .ftp-deploy-sync-state.json on the server to know what is there).
      - name: Upload to Hostinger (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: site/
          server-dir: public_html/castaway/
